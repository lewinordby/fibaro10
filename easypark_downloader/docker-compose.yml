services:
  easypark_downloader:
    build: .
    container_name: easypark_downloader
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "192.168.20.218:8109:8109"
    volumes:
      - ${EASYPARK_HOST_DATA_DIR:-./data}:/data
    networks:
      - default
      - fibaro10
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/health', timeout=10).read()\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

networks:
  fibaro10:
    external: true
    name: fibaro10_default
