    container_name: fibaro10_green
    environment:
      <<: *fibaro10-core-environment
      FIBARO10_PROCESS_ROLE: web-green
      FIBARO10_BACKGROUND_TASKS_ENABLED: "false"

  fibaro10_worker:
    <<: *fibaro10-core
    container_name: fibaro10_worker
    environment:
      <<: *fibaro10-core-environment
      FIBARO10_PROCESS_ROLE: worker
      FIBARO10_BACKGROUND_TASKS_ENABLED: "true"

  fibaro10:
    image: caddy:2-alpine
    container_name: fibaro10
    restart: unless-stopped
    ports:
      - "192.168.20.218:8110:8110"
    volumes:
      - ./Caddyfile.core:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8110/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  revenue_app:
