    container_name: sun2_backfill_downloader
    restart: unless-stopped
    env_file:
      - ./sun2_backfill_downloader/.env
    depends_on:
      - fibaro10
    ports:
      - "192.168.20.218:8097:8097"
    volumes:
      - ${SUN2_DAILY_DATA_DIR:-/share/CACHEDEV1_DATA/Public/containerdata/sun2_daily_data}:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/json', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sun2_importer:
