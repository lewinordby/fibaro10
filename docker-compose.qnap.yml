x-fibaro10-core-environment: &fibaro10-core-environment
  APP_BUILD: ${APP_BUILD:-1823}
  SUN2_AXIS_SNAPSHOT_ROOT: /axis_snapshots
  SUN2_AXIS_SNAPSHOT_LINK_DAYS: ${SUN2_AXIS_SNAPSHOT_LINK_DAYS:-35}
  CAR_INFO_LOOKUP_URL: http://car_info_lookup:8126
  OWNTRACKS_SERVICE_URL: http://owntracks_service:8128
  UNIFI_PROTECT_EVENTS_URL: http://unifi_protect_events:8130
  UNIFI_PROTECT_READ_API_TOKEN: ${UNIFI_PROTECT_READ_API_TOKEN:-}
  UNIFI_PROTECT_API_TIMEOUT_SECONDS: ${UNIFI_PROTECT_API_TIMEOUT_SECONDS:-10}
  ALARM_APP_URL: ${ALARM_APP_URL:-https://alarm.lilletorget.net}

x-fibaro10-core: &fibaro10-core
  image: fibaro10-core:local
  build:
    context: .
    args:
      APP_COMMIT: ${APP_COMMIT:-unknown}
  restart: unless-stopped
  env_file:
    - .env
    - .env.hc3-watchdog
  volumes:
    - ${AXIS_HOST_SNAPSHOT_DIR:-./axis_camera_snapshots/snapshots}:/axis_snapshots:ro
    - ${FIBARO10_NIGHTLY_BACKUP_STATUS_DIR:-/share/CACHEDEV3_DATA/fibaro10_archive/fibaro10_backups}:/system_backup_status/nightly:ro
    - ${FIBARO10_FULL_BACKUP_STATUS_DIR:-/share/CACHEDEV3_DATA/fibaro10_archive/full_restore_backup/latest}:/system_backup_status/full:ro
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=5).read()\""]
    interval: 10s
    timeout: 10s
    retries: 6
    start_period: 30s

services:
  owntracks_postgres:
    image: postgres:17
    container_name: owntracks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OWNTRACKS_POSTGRES_DB:-owntracks}
      POSTGRES_USER: ${OWNTRACKS_POSTGRES_USER:-owntracks}
      POSTGRES_PASSWORD: ${OWNTRACKS_POSTGRES_PASSWORD:-owntracks}
    volumes:
      - ${OWNTRACKS_POSTGRES_DATA_DIR:-./owntracks_service/postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OWNTRACKS_POSTGRES_USER:-owntracks} -d ${OWNTRACKS_POSTGRES_DB:-owntracks}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  owntracks_service:
    build:
      context: ./owntracks_service
    container_name: owntracks_service
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      owntracks_postgres:
        condition: service_healthy
    ports:
      - "192.168.20.218:8128:8128"
    volumes:
      - ${OWNTRACKS_HOST_DATA_DIR:-./owntracks_service/data}:/data
    environment:
      OWNTRACKS_DATA_DIR: /data
      OWNTRACKS_DATABASE_URL: ${OWNTRACKS_DATABASE_URL:-postgresql+psycopg://owntracks:owntracks@owntracks_postgres:5432/owntracks}
      OWNTRACKS_PUBLIC_BASE_URL: ${OWNTRACKS_PUBLIC_BASE_URL:-https://owntracks.lilletorget.net}
      OWNTRACKS_APP_BUILD: ${OWNTRACKS_APP_BUILD:-28}
      OWNTRACKS_APP_COMMIT: ${APP_COMMIT:-unknown}
      OWNTRACKS_MAX_CALCULATION_ACCURACY_M: ${OWNTRACKS_MAX_CALCULATION_ACCURACY_M:-30}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8128/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  fibaro10_blue:
    <<: *fibaro10-core
    container_name: fibaro10_blue
    environment:
      <<: *fibaro10-core-environment
      FIBARO10_PROCESS_ROLE: web-blue
      FIBARO10_BACKGROUND_TASKS_ENABLED: "false"

  fibaro10_green:
