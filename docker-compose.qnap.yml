      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/json', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
 
  parking_sun_linker:
    build:
      context: ./parking_sun_linker
    container_name: parking_sun_linker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - fibaro10
    ports:
      - "192.168.20.218:8127:8127"
    environment:
      FIBARO10_BASE_URL: http://fibaro10:8110
      KOBLE_RUN_ON_START: ${KOBLE_RUN_ON_START:-true}
      KOBLE_LOOP_SLEEP_SECONDS: ${KOBLE_LOOP_SLEEP_SECONDS:-0.2}
      KOBLE_BATCH_SIZE: ${KOBLE_BATCH_SIZE:-25}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8127/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  fibaro10_proxy:
    image: caddy:2.10.2-alpine
    container_name: fibaro10_proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ip route replace ${FIBARO10_VPN_ROUTE:-192.168.0.0/16}
        via ${FIBARO10_LAN_GATEWAY:-192.168.20.1} dev eth1 &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - online_dashboard
      - owntracks_service
      - maintenance_mobile
      - alarm_mobile
      - fibaro10
      - revenue_app
      - parking_app
      - sun_app
      - energy_app
      - operations_app
      - maintenance_app
      - system_app
      - link_app
    ports:
      - "8081:80"
      - "8443:443"
    networks:
      default:
      https_lan:
        ipv4_address: ${FIBARO10_HTTPS_LAN_IP:-192.168.20.219}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FIBARO10_CADDY_DATA_DIR:-fibaro10_caddy_data}:/data
      - ${FIBARO10_CADDY_CONFIG_DIR:-fibaro10_caddy_config}:/config
      - ${FIBARO10_TLS_CERT_DIR:-/share/CACHEDEV2_DATA/fibaro10_runtime/caddy/lego}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  fibaro10_caddy_data:
  fibaro10_caddy_config:

networks:
  https_lan:
    external: true
    name: ${FIBARO10_HTTPS_LAN_NETWORK:-qnet-static-eth1-444890}
