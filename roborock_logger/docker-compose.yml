services:
  roborock_logger:
    build: .
    container_name: roborock_logger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_TIMEZONE: Europe/Oslo
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-60}
      TELEMETRY_SETTINGS_INTERVAL_SECONDS: ${TELEMETRY_SETTINGS_INTERVAL_SECONDS:-900}
      ROBOROCK_WATER_INTERLOCK_ENABLED: ${ROBOROCK_WATER_INTERLOCK_ENABLED:-true}
    ports:
      - "8095:8095"
    volumes:
      - ./data:/data
