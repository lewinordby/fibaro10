services:
  roborock_logger:
    build: .
    container_name: roborock_logger
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_TIMEZONE: Europe/Oslo
    ports:
      - "192.168.20.218:8095:8095"
    volumes:
      - roborock_logger_data:/data
    networks:
      - fibaro10_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=10).read()\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

volumes:
  roborock_logger_data:
    external: true
    name: roborock_logger_roborock_logger_data

networks:
  fibaro10_default:
    external: true
    name: fibaro10_default
